<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLab Arcade</title>
    <!-- Font Awesome for category icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #111113;
            --header-bg: #1a1a1e;
            --card-bg: #1a1a1e;
            --card-hover: #26262c;
            --accent-color: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --badge-new: #3b82f6;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
        }

        .logo-img {
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-container {
            position: relative;
        }

        .search-bar {
            background-color: #2c2c35;
            border: none;
            border-radius: 20px;
            padding: 8px 15px 8px 35px;
            color: white;
            width: 220px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        /* Categories Bar */
        .categories {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid #27272a;
            overflow-x: auto;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .category-btn:hover, .category-btn.active {
            background-color: #2c2c35;
            color: white;
        }

        /* Main Content Layout */
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .section-title span {
            font-size: 13px;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-3px);
        }

        .game-thumbnail {
            width: 100%;
            height: 120px;
            background-color: #2c2c35;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .game-info {
            padding: 0 4px 6px 4px;
        }

        .game-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e4e4e7;
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 0 8px 0 8px;
            text-transform: uppercase;
            z-index: 10;
        }

        .badge.new {
            background-color: var(--badge-new);
        }

        /* Game Player Modal & Control Toolbar */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-header-bar {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .modal-game-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .modal-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background-color: #2c2c35;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #3f3f46;
        }

        .modal-content {
            width: 85%;
            max-width: 1000px;
            height: 75vh;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-container {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border-color);
            border-top: none;
        }

        .close-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="https://res.cloudinary.com/dodmrjlqa/image/upload/v1791501681/Screenshot_2026-10-08_192042_i7v1us.png" alt="GAMES Logo" class="logo-img">
        </div>

        <div class="header-right">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-bar" placeholder="Search Game...">
            </div>
            <div class="header-icons">
                <i class="fas fa-heart"></i>
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Categories Navigation -->
    <div class="categories">
        <button class="category-btn active"><i class="fas fa-mouse-pointer"></i> Clicker</button>
        <button class="category-btn">.io</button>
        <button class="category-btn"><i class="fas fa-compass"></i> Adventure</button>
        <button class="category-btn"><i class="fas fa-users"></i> 2 Player</button>
        <button class="category-btn"><i class="fas fa-bullseye"></i> Shooting</button>
        <button class="category-btn"><i class="fas fa-futbol"></i> Sports</button>
        <button class="category-btn"><i class="fas fa-car"></i> Car</button>
        <button class="category-btn"><i class="fas fa-puzzle-piece"></i> Puzzle</button>
    </div>

    <!-- Main Content Grid -->
    <div class="container">
        <!-- New Games Section -->
        <section>
            <div class="section-title">New games <span>View more ›</span></div>
            <div class="game-grid">
                <!-- Subway Surfers Card -->
                <div class="game-card" onclick="openGame('clsubwaysurfersberlin.html', 'Subway Surfers')">
                    <span class="badge new">New</span>
                    <img src="https://imgs.search.brave.com/FZ2YciuLR4g1n-8VLNzHyTAlrFzZS93DFupJMyjzhcQ/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly93d3cu/bWV0YWNyaXRpYy5j/b20vYS9pbWcvcmVz/aXplL2Y3NWVkMjdm/NGRjNDlhZmRiNjcx/ZTQ4YmQ1OGI4NWFm/N2M0MTFiMWUvY2F0/YWxvZy9wcm92aWRl/ci82LzEyLzYtMS0y/MzY1ODQtNTIuanBn/P2F1dG89d2VicCZm/aXQ9Y29udGFpbiZo/ZWlnaHQ9NDgwJnF1/YWxpdHk9NzA" alt="Subway Surfers" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">Subway Surfers</div>
                    </div>
                </div>

                <!-- Geometry Dash Lite Card -->
                <div class="game-card" onclick="openGame('GeometryDashLite.html', 'Geometry Dash Lite')">
                    <span class="badge new">New</span>
                    <img src="https://cdn2.steamgriddb.com/logo_thumb/a1a2d4c37bcf89723258332b069889b0.png" alt="Geometry Dash Lite" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">Geometry Dash Lite</div>
                    </div>
                </div>

                <!-- Among Us Card -->
                <div class="game-card" onclick="openGame('amongus.html', 'Among Us')">
                    <span class="badge new">New</span>
                    <img src="https://logodix.com/logo/2207096.png" alt="Among Us" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">Among Us</div>
                    </div>
                </div>

                <!-- Baldi Basics Card -->
                <div class="game-card" onclick="openGame('baldisbasics.html', 'Baldi Basics')">
                    <span class="badge new">New</span>
                    <img src="https://imgs.search.brave.com/_M_YSNCfcFVBdqTwQCW2KAsnIUnIsnWbN2eot0dNX-I/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzgzLzNl/LzcwLzgzM2U3MDRl/Y2RlZmRiZGIyZGU2/ODMwY2EwZmI1MGM0/LmpwZw" alt="Baldi Basics" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">Baldi Basics</div>
                    </div>
                </div>

                <!-- Snake Game Card -->
                <div class="game-card" onclick="openGame('Snake Game.html', 'Snake Game')">
                    <span class="badge new">New</span>
                    <img src="https://snake.io/assets/design/home/app_icon_snakeio.webp?v=1.3.33" alt="Snake Game" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">Snake Game</div>
                    </div>
                </div>

                <!-- totm Card -->
                <div class="game-card" onclick="openGame('totm.html', 'totm')">
                    <span class="badge new">New</span>
                    <img src="https://www.magnific.com/free-photo/dark-abstract-background_879786.htm" alt="totm" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">totm</div>
                    </div>
                </div>

                <!-- FNAF Card -->
                <div class="game-card" onclick="openGame('FNAF.html', 'FNAF')">
                    <span class="badge new">New</span>
                    <img src="https://imgs.search.brave.com/fSbVA-1vvx55GF7FI2MEXb-3zd_QpjVd9QE-KocvnbQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzE0LzM4/LzY1LzE0Mzg2NWM5/ZTQzYmYyMmQwZTBh/ZWIyNjBkNzZmODc4/LmpwZw" alt="FNAF" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">FNAF</div>
                    </div>
                </div>

                <!-- BitLife Card -->
                <div class="game-card" onclick="openGame('bitlife.html', 'BitLife')">
                    <span class="badge new">New</span>
                    <img src="https://play-lh.googleusercontent.com/fUM-UyywXxjC8soxAZdIlxJrlRRXmql8wkE426SHzft4lJycSKVd2jCYQQX1BEG9Xw=w480-h960-rw" alt="BitLife" class="game-thumbnail">
                    <div class="game-info">
                        <div class="game-title">BitLife</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Game Player Modal & Control Toolbar -->
    <div id="modal">
        <div class="modal-header-bar">
            <span class="modal-game-title" id="modalTitle">Game Title</span>
            <div class="modal-controls">
                <button class="control-btn" onclick="popOutGame()"><i class="fas fa-external-link-alt"></i> Pop Out</button>
                <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Fullscreen</button>
            </div>
        </div>
        <div class="modal-content" id="modalContainer">
            <iframe id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
        </div>
        <div class="close-container">
            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
    </div>

    <script>
        let currentGameUrl = '';

        function openGame(url, title) {
            currentGameUrl = url;
            document.getElementById('gameFrame').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function toggleFullScreen() {
            const container = document.getElementById('modalContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function popOutGame() {
            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }
    </script>
</body>
</html>
